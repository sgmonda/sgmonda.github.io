title: Proyectos
description: Inquieto, no puedo parar de crear. Estos son algunos de mis proyectos.

categories:
  - id: software
    title: Software
    description: Llevo unos cuantos años dedicándome profesionalmente al desarrollo de software, creando experiencias completas desde cero y liderando equipos de desarrollo. Pero más allá de lo extrictamente profesional, mis conocimientos y experiencia me permiten divertirme con experimentos y productos propios.
  - id: music
    title: Música
    description: 'Me gusta componer música y escribir canciones. Puedes ver mis trabajos en solitario y colaboraciones en las plataformas de streaming (como Spotify o Apple Music), bajo mi nombre artístico: "Monda". Además, escribo música para otros artistas y estilos, también disponible en Spotify y otras plataformas de streaming'
  - id: fotovideo
    title: Fotografía y vídeo
    description: La creación audiovisual es otra disciplina con la que disfruto con regularidad. La fotografía y la videografía están tan estrechamente relacionadas que raramente se concibe la una sin la otra. Estas son algunas de las creaciones de las que estoy más orgulloso.
  - id: books
    title: Books
    description: Con la escritura me pasa algo parecido a la música, es una actividad que me gusta mucho pero que no practico con tanta regularidad. Sin embargo, de vez en cuando encuentro tiempo para escribir algo.

items:
  - title: Wakeful Control
    subtitle: MacOS App
    description: App para MacOS que permite inhibir el modo de suspensión del sistema desde la barra de menú, para evitar que el sistema se duerma mientras se realizan tareas que requieren que esté despierto, como compilación de software.
    url: https://apps.apple.com/es/app/wakeful-control/id6744520882?mt=12
    category: software

  - title: Sergamon
    subtitle: Font
    description: Fuente monoespaciada open-source para programación y diseño retro, de aspecto pixelado, para hackers nostálgicos. Es la fuente que se utiliza en esta web.
    url: https://sgmonda.com/sergamon
    category: software

  - title: Streamfu
    subtitle: TypeScript library
    description: Biblioteca open-source de JS/TS para programación funcional de streams de datos. Convierte la ardua experiencia de manejar streams en algo similar a lo que es trabajar con arrays.
    url: https://jsr.io/@sgmonda/streamfu
    category: software

  - title: Keepcalm
    subtitle: Syntax theme
    description: Syntax highlighting theme para desarrollo de software, pensado para amantes del modo oscuro. Es un proyecto open source.
    url: https://marketplace.visualstudio.com/items?itemName=sgmonda.keepcalm-theme
    category: software

  - title: Stdio
    subtitle: TypeScript library
    description: Paquete de NPM para gestión de entrada/salida estándar en Node.js. Es un proyecto open source con más de 40k descargas semanales.
    url: https://npmjs.org/stdio
    category: software

  - title: Formelio
    subtitle: React library
    description: Librería de NPM para creación de formularios dinámicos en React. Es un proyecto open source, escrito en Typescript, cuyo código está disponible en GitHub.
    url: https://npmjs.org/formelio
    category: software

  - title: Schedu.land
